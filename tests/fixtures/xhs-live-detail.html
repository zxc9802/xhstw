<!doctype html>
<html lang="zh-CN">
  <body>
    <div class="note-detail-mask" role="dialog">
      <h1 class="title">三组 Live 测试</h1>
      <div class="content">Live 图文正文</div>
      <div class="live-photo-contain">
        <div class="swiper-slide swiper-slide-active" data-swiper-slide-index="0">
          <img class="live-img" src="https://sns-webpic-qc.xhscdn.com/live-1.jpg">
          <video class="live-video" src="blob:https://www.xiaohongshu.com/live-1"></video>
        </div>
        <div class="swiper-slide" data-swiper-slide-index="1">
          <img class="live-img" src="https://sns-webpic-qc.xhscdn.com/live-2.jpg">
          <video class="live-video" src="blob:https://www.xiaohongshu.com/live-2"></video>
        </div>
        <div class="swiper-slide" data-swiper-slide-index="2">
          <img class="live-img" src="https://sns-webpic-qc.xhscdn.com/live-3.jpg">
          <video class="live-video" src="blob:https://www.xiaohongshu.com/live-3"></video>
        </div>
        <div class="swiper-slide swiper-slide-duplicate" data-swiper-slide-index="0">
          <img class="live-img" src="https://sns-webpic-qc.xhscdn.com/live-1.jpg">
          <video class="live-video" src="blob:https://www.xiaohongshu.com/live-1-duplicate"></video>
        </div>
        <button class="swiper-button-prev" type="button">上一张</button>
        <button class="swiper-button-next" type="button">下一张</button>
        <span class="live-counter">1/3</span>
      </div>

</html>
